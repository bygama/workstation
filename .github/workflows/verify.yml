name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository verification
        shell: pwsh
        run: ./tests/run.ps1

  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/checkout@v4
        with:
          repository: pegasuzhq/Agent-Engineering
          path: standard
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Agent-lint against the standard
        run: node standard/scripts/agent-lint.mjs repo
